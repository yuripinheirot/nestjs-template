volumes:
  app-vol:
  postgres-vol:

networks:
  app-network:
    driver: bridge

services:
  base: &base
    build:
      target: development
      context: .
      dockerfile: Dockerfile
    working_dir: /home/node/app
    user: node
    env_file:
      - .env
    volumes:
      - ./:/home/node/app
    networks:
      - app-network

  api:
    <<: *base
    container_name: api
    env_file:
      - ./.env
    ports:
      - 3003:3003
      - 9229:9229
    command: yarn dev
    depends_on:
      db:
        condition: service_healthy
      prisma-studio:
        condition: service_started

  db:
    image: postgres:16
    container_name: postgres
    volumes:
      - postgres-vol:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    restart: always
    environment:
      POSTGRES_DB: api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 10s
      retries: 5
  
  prisma-studio:
    <<: *base
    container_name: prisma-studio
    command: npx prisma studio --port 5555 --browser none
    ports:
      - '5555:5555'
    env_file:
      - .env
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy


  specs:
    <<: *base
    command: yarn test
    env_file:
      - ./.env
    environment:
      NODE_ENV: local
